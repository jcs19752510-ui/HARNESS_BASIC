<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>로그인 — 학생 출결 등록 프로그램</title>
</head>
<body>
  <h1>로그인</h1>
  {% if error %}
  <p role="alert" style="color:#b00020">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <label>아이디 <input type="text" name="username" autocomplete="username" required></label><br>
    <label>비밀번호 <input type="password" name="password" autocomplete="current-password" required></label><br>
    <button type="submit">로그인</button>
  </form>
</body>
</html>
