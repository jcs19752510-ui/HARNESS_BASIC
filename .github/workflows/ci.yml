name: CI

on:
  # 기준(base) 브랜치: CLAUDE.md "프로젝트 개요"에 선언된 PROD_SCH와 일치시킬 것
  # (이 브랜치명을 바꾸면 CLAUDE.md의 선언도 반드시 함께 수정)
  pull_request:
    branches: [PROD_SCH]

jobs:
  repo-health:
    name: 저장소 상태 점검 (harness_19 보완 — 문서 템플릿이 아닌 저장소 상태 자체 검증)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: .gitignore 존재 확인
        run: test -f .gitignore || (echo ".gitignore가 없습니다 — 하네스 실패 패턴 #2 재발" && exit 1)

      - name: 빌드 산출물(__pycache__/.pyc 등)이 커밋되지 않았는지 확인
        run: |
          leftover=$(git ls-files | grep -E '__pycache__|\.pyc$|\.pytest_cache' || true)
          if [ -n "$leftover" ]; then
            echo "커밋된 빌드 산출물 발견 (브랜치 전환 잔여물 가능성):"
            echo "$leftover"
            exit 1
          fi

      - name: PR 대상 브랜치가 이 브랜치의 커밋 전체를 실제로 포함하는지 확인 (부분 병합 방지)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          if ! git merge-base --is-ancestor origin/${{ github.base_ref }} HEAD; then
            echo "이 브랜치가 base(${{ github.base_ref }})보다 뒤처져 있습니다 — 먼저 base를 반영하세요."
            exit 1
          fi

  secret-scan:
    name: 시크릿 스캔 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 공식 GitHub Action을 태그가 아닌 커밋 SHA로 고정 — 태그 재사용(bait-and-switch)
      # 공급망 공격을 막기 위함. gitleaks/gitleaks-action v3.0.0 (2026-05-30 릴리스)이
      # 가리키는 실제 커밋. 버전을 올릴 때는 새 태그의 커밋 SHA를 다시 조회해서 갱신할 것
      # (https://api.github.com/repos/gitleaks/gitleaks-action/git/refs/tags/<새태그>).
      - name: gitleaks 실행 (공식 Action, 커밋 SHA 고정)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: 의존성 취약점 스캔 (스택 확정 후 구체화 — harness_13_tech_conventions.md §7 참조)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 의존성 취약점 스캔 실행
        run: |
          echo "⚠️ 아직 미구성 상태입니다. harness_13_tech_conventions.md §7을 확정한 뒤"
          echo "   이 스텝을 실제 스캔 명령으로 교체하세요 (예: npm audit / pip-audit / osv-scanner)."
          exit 1

  lint:
    name: 정적 분석/포맷팅/타입체크 (스택 확정 후 구체화 — harness_13_tech_conventions.md §4 참조)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lint/format/type-check 실행
        run: |
          echo "⚠️ 아직 미구성 상태입니다. harness_13_tech_conventions.md §4를 확정한 뒤"
          echo "   이 스텝을 실제 lint/format/type-check 명령으로 교체하세요 (예: eslint+prettier / ruff+mypy)."
          exit 1

  test:
    name: TRD §6 기반 테스트 (스택 확정 후 구체화)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 의존성 설치 및 테스트 실행
        run: |
          echo "⚠️ 아직 미구성 상태입니다. harness_13_tech_conventions.md를 참조해 프로젝트"
          echo "   스택을 확정한 뒤, 의존성 설치와 TRD §6 기반 테스트 스위트 실행으로 교체하세요."
          exit 1
